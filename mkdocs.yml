site_name: scpolivi
site_description: scPoli on scvi-tools — population-level integration with condition embeddings and prototypes
repo_url: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - User guide:
      - Concepts: concepts.md
      - Data requirements: data.md
      - Training: training.md
      - Query mapping & projection: mapping.md
      - Graph regularization: graph.md
      - Coming from scArches: scarches.md
  - Walkthroughs:
      - Overview: examples/index.md
      - 1. Reference and query: examples/01_reference_and_query.md
      - 2. Several keys, hierarchy, new types: examples/02_multiple_keys_and_hierarchy.md
      - 3. Projection and minification: examples/03_projection_and_minification.md
      - 4. Graph regularization: examples/04_graph_regularization.md
      - 5. Models from scArches: examples/05_from_scarches.md
  - API:
      - Overview: api/index.md
      - SCPOLI model: api/model.md
      - Graph utilities: api/graph.md
      - Module: api/module.md
      - Training internals: api/training.md
      - Data fields: api/data.md
  - Benchmarks: benchmarks.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: false
            heading_level: 2
