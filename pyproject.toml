[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.24"]

[project]
name = "scpolivi"
version = "0.0.1"
description = "scPoli (population-level integration with prototypes) reimplemented on scvi-tools."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "scvi-tools>=1.5.2,<1.6",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
leiden = ["scanpy>=1.10", "igraph", "leidenalg"]
test = ["pytest>=8", "scanpy>=1.10", "igraph", "leidenalg"]

[tool.hatch.build.targets.wheel]
packages = ["src/scpolivi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["parity: needs golden outputs generated with scArches (scripts/make_golden.py)"]
